services:
  # ─────────────────────────────────────────────
  # PicoClaw Agent (one-shot query)
  #   docker compose -f docker/docker-compose.yml run --rm picoclaw-agent -m "Hello"
  # ─────────────────────────────────────────────
  picoclaw-agent:
    build:
      context: ..
      dockerfile: Dockerfile.custom
    container_name: picoclaw-agent
    profiles:
      - agent
    env_file:
      - ../.env
    environment:
      - GH_TOKEN=${GH_TOKEN}
    volumes:
      - ../config/config.json:/home/picoclaw/.picoclaw/config.json:ro
      - ../workspace:/home/picoclaw/.picoclaw/workspace
      - ${HOME}/.config/gh:/home/picoclaw/.config/gh:ro
    entrypoint: ["picoclaw", "agent"]
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ─────────────────────────────────────────────
  # PicoClaw Gateway (Long-running Bot)
  #   docker compose -f docker/docker-compose.yml --profile gateway up -d
  # ─────────────────────────────────────────────
  picoclaw-gateway:
    build:
      context: ..
      dockerfile: Dockerfile.custom
    container_name: picoclaw-gateway
    restart: on-failure
    profiles:
      - gateway
    env_file:
      - ../.env
    environment:
      - GH_TOKEN=${GH_TOKEN}
    volumes:
      - ../config/config.json:/home/picoclaw/.picoclaw/config.json:ro
      - ../workspace:/home/picoclaw/.picoclaw/workspace
      - ${HOME}/.config/gh:/home/picoclaw/.config/gh:ro
    command: ["gateway"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
